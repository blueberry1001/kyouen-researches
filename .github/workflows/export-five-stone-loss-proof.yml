name: Export five-stone LOSS proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-five-stone-loss-proof.yml'
      - 'cpp/solvers/**'
      - 'rust/independent-verifier/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact solver and independent verifier
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            cpp/solvers/kyouen_solver_10_kyoenc4.cpp \
            -o /tmp/kyouen-solver-10-kyoenc4
          cargo build --release --manifest-path rust/independent-verifier/Cargo.toml \
            --bin kyouen-cert-verify
      - name: Search and export with disk-backed indexes
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'wall=%e rss_kb=%M' -o /tmp/five-loss.time \
            timeout --signal=TERM --kill-after=20s 900s \
            /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '61,2,73,13,91' \
            /tmp/five-loss.cert \
            3 80 5000000 /tmp/five-loss-proof.index 0 0 \
            /tmp/five-loss-witness.log 0 \
            /tmp/five-loss-witness.index 20000000 \
            > /tmp/five-loss.out 2> /tmp/five-loss.err
          rc=$?
          set -e
          echo "$rc" > /tmp/five-loss.exit
          cat /tmp/five-loss.out
          cat /tmp/five-loss.err
          cat /tmp/five-loss.time
      - name: Verify a completed proof
        shell: bash
        run: |
          rc=$(cat /tmp/five-loss.exit)
          if [[ "$rc" = 0 ]]; then
            /usr/bin/time -f 'verify_wall=%e verify_rss_kb=%M' -o /tmp/five-loss-verify.time \
              timeout --signal=TERM --kill-after=20s 900s \
              rust/independent-verifier/target/release/kyouen-cert-verify \
              /tmp/five-loss.cert \
              > /tmp/five-loss-verify.out 2> /tmp/five-loss-verify.err
            cat /tmp/five-loss-verify.out
            cat /tmp/five-loss-verify.err
            cat /tmp/five-loss-verify.time
            grep -q '^root_outcome=LOSS$' /tmp/five-loss-verify.out
          else
            : > /tmp/five-loss-verify.out
            : > /tmp/five-loss-verify.err
            : > /tmp/five-loss-verify.time
          fi
      - name: Assemble summary
        run: |
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path
          def read(path):
              p=Path(path);return p.read_text() if p.exists() else ''
          stdout=read('/tmp/five-loss.out');stderr=read('/tmp/five-loss.err');timing=read('/tmp/five-loss.time')
          verify=read('/tmp/five-loss-verify.out');verify_timing=read('/tmp/five-loss-verify.time')
          rc=int(read('/tmp/five-loss.exit').strip())
          def find(pattern,text,default=''):
              match=re.search(pattern,text);return match.group(1) if match else default
          result=''
          for line in stdout.splitlines()[1:]:
              if ',LOSS,' in line or ',WIN,' in line: result=line
          parts=result.split(',')
          row={
              'state':'61,2,73,13,91','exit_code':rc,
              'status':{0:'COMPLETE',1:'ERROR',3:'TABLE_FULL',4:'CHECKPOINT',124:'TIMEOUT',137:'KILLED'}.get(rc,'OTHER'),
              'outcome':parts[-5] if len(parts)>=6 else '',
              'search_visited':parts[-4] if len(parts)>=6 else '',
              'search_maxdepth':parts[-3] if len(parts)>=6 else '',
              'search_memo':parts[-2] if len(parts)>=6 else '',
              'search_seconds':parts[-1] if len(parts)>=6 else '',
              'proof_nodes':find(r'certificate nodes=(\d+)',stderr),
              'proof_recomputed':find(r'recomputed=(\d+)',stderr),
              'certificate_bytes':str(Path('/tmp/five-loss.cert').stat().st_size) if Path('/tmp/five-loss.cert').exists() else '',
              'proof_index_bytes':str(Path('/tmp/five-loss-proof.index').stat().st_size) if Path('/tmp/five-loss-proof.index').exists() else '',
              'witness_unique':find(r'witness_log .* unique=(\d+)',stderr),
              'witness_conflicts':find(r'conflicts=(\d+)',stderr),
              'witness_hits':find(r'proof_hits=(\d+)',stderr),
              'witness_misses':find(r'proof_misses=(\d+)',stderr),
              'witness_log_bytes':str(Path('/tmp/five-loss-witness.log').stat().st_size) if Path('/tmp/five-loss-witness.log').exists() else '',
              'witness_index_bytes':str(Path('/tmp/five-loss-witness.index').stat().st_size) if Path('/tmp/five-loss-witness.index').exists() else '',
              'wall_seconds':find(r'wall=([^ ]+)',timing),
              'max_rss_kb':find(r'rss_kb=(\d+)',timing),
              'verified':'yes' if 'CERTIFICATE VALID' in verify else 'no',
              'verify_nodes':find(r'^nodes=(\d+)$',verify),
              'verify_losing_nodes':find(r'^losing_nodes=(\d+)$',verify),
              'verify_winning_nodes':find(r'^winning_nodes=(\d+)$',verify),
              'verify_wall_seconds':find(r'verify_wall=([^ ]+)',verify_timing),
              'verify_max_rss_kb':find(r'verify_rss_kb=(\d+)',verify_timing),
          }
          with open('five-stone-loss-proof-summary.csv','w',newline='') as output:
              writer=csv.DictWriter(output,fieldnames=row.keys());writer.writeheader();writer.writerow(row)
          PY
          cat five-stone-loss-proof-summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: five-stone-loss-proof-summary
          path: five-stone-loss-proof-summary.csv
      - name: Compress completed certificate
        if: always()
        run: |
          if test -s /tmp/five-loss.cert; then
            zstd -T0 -19 /tmp/five-loss.cert -o five-stone-loss.cert.zst
          else
            : > five-stone-loss.cert.zst
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: five-stone-loss-certificate
          path: five-stone-loss.cert.zst
