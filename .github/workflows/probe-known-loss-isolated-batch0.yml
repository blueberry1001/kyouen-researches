name: Probe known LOSS isolated batch0

on:
  push:
    branches: [probe-two-stone-subsets]
    paths:
      - '.github/workflows/probe-known-loss-isolated-batch0.yml'
      - 'scripts/run_blind_probe_batch_isolated.py'
      - 'scripts/probe_cert_solver.cpp'
      - 'scripts/probe_parts/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        parent:
          - '2,9,33'
          - '4,9,33'
          - '9,12,33'
          - '9,19,33'
          - '9,23,33'
          - '0,31,36'
          - '0,36,44'
    steps:
      - uses: actions/checkout@v4

      - name: Build probe solver
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -DNDEBUG scripts/probe_cert_solver.cpp -o /tmp/probe_cert_solver
          sha256sum /tmp/probe_cert_solver

      - name: Run batch0 with one fresh process per child
        env:
          KYOUEN_PROBE_SOLVER: /tmp/probe_cert_solver
        run: |
          set -euo pipefail
          python3 scripts/run_blind_probe_batch_isolated.py '${{ matrix.parent }}' 0 3

      - name: Validate isolated output
        run: |
          set -euo pipefail
          safe=$(echo '${{ matrix.parent }}' | tr ',' '_')
          out="results/10x10/blind_probe_children/probe_isolated_${safe}_batch0_1000000.csv"
          python3 - "$out" <<'PY'
          import csv, sys
          path = sys.argv[1]
          with open(path, newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('empty isolated probe output')
          states = [r['state'] for r in rows]
          if len(states) != len(set(states)):
              raise SystemExit('duplicate state in isolated output')
          if any(r['outcome'] != 'PROBE' for r in rows):
              raise SystemExit('unexpected non-PROBE outcome')
          if any(int(r['visited']) != 1_000_000 for r in rows):
              raise SystemExit('probe did not consume fixed 1M node budget')
          # Fresh-process memo must be child-local, not cumulative across CSV rows.
          # Do not require a particular value; only reject impossible cumulative-scale carryover.
          if any(int(r['memo']) > 1_100_000 for r in rows):
              raise SystemExit('memo exceeds fresh-process sanity bound')
          print(f'validated children={len(rows)} memo_range={min(int(r["memo"]) for r in rows)}..{max(int(r["memo"]) for r in rows)}')
          PY

      - name: Upload raw isolated probe
        uses: actions/upload-artifact@v4
        with:
          name: known-loss-isolated-${{ strategy.job-index }}
          path: |
            results/10x10/blind_probe_children/probe_isolated_*_batch0_1000000.csv
            results/10x10/blind_probe_children/probe_isolated_*_batch0_1000000.err
          if-no-files-found: error
          retention-days: 30
