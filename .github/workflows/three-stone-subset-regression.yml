name: Three-stone 10x10 subset regression

on:
  push:
    branches: [main]
    paths:
      - 'results/10x10/three-stone-subsets-of-medium-loss.csv'
      - 'cpp/solvers/**'
      - '.github/workflows/three-stone-subset-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'results/10x10/three-stone-subsets-of-medium-loss.csv'
      - 'cpp/solvers/**'
      - '.github/workflows/three-stone-subset-regression.yml'
  workflow_dispatch:

jobs:
  validate-three-stone-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 56 recorded roots and direct witnesses
        run: |
          python3 - <<'PY'
          import csv
          import itertools
          from pathlib import Path

          root = [90, 61, 2, 73, 69, 66, 13, 91]
          expected_loss_states = {'90,73,91', '90,2,91'}
          known_four_stone_losses = {
              frozenset(map(int, line.split(',')))
              for line in '''
          90,61,2,66
          90,61,73,66
          90,61,69,66
          90,61,66,91
          61,2,69,66
          61,2,66,91
          61,73,69,66
          61,73,66,13
          61,73,66,91
          61,69,66,13
          61,69,66,91
          61,66,13,91
          '''.strip().splitlines()
          }

          path = Path('results/10x10/three-stone-subsets-of-medium-loss.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          expected = list(itertools.combinations(root, 3))
          actual = [tuple(map(int, row['state'].split(','))) for row in rows]
          assert len(rows) == 56, len(rows)
          assert actual == expected, 'rows must contain C(8,3) roots in root order'
          assert len(set(actual)) == 56
          assert {r['state'] for r in rows if r['outcome'] == 'LOSS'} == expected_loss_states
          assert all(r['outcome'] in ('WIN', 'LOSS') for r in rows)

          direct = [r for r in rows if r['classification_source'] == 'DIRECT_TO_VERIFIED_4_STONE_LOSS']
          exact = [r for r in rows if r['classification_source'] == 'EXACT_INDEPENDENT_SEARCH']
          assert len(direct) == 30, len(direct)
          assert len(exact) == 26, len(exact)

          for row in direct:
              assert row['outcome'] == 'WIN'
              state = frozenset(map(int, row['state'].split(',')))
              move = int(row['winning_move_to_loss'])
              assert move not in state
              assert state | {move} in known_four_stone_losses
              assert int(row['visited']) == 0
              assert row['load'] == ''
              assert row['search_profile'] == ''

          for row in exact:
              assert row['winning_move_to_loss'] == ''
              assert int(row['visited']) > 0
              assert int(row['maxdepth']) in (18, 19)
              assert int(row['memo']) > 0
              assert float(row['solver_seconds']) > 0
              assert float(row['wall_seconds']) > 0
              assert int(row['max_rss_kb']) > 0
              assert int(row['shrink']) in (0, 1, 2, 3)
              assert int(row['load']) in (80, 90)
              assert row['search_profile'] in ('standard', 'targeted-v1', 'targeted-v2')

          profile_by_state = {r['state']: r['search_profile'] for r in exact}
          assert profile_by_state['90,69,91'] == 'standard'
          assert profile_by_state['90,73,91'] == 'targeted-v1'
          assert profile_by_state['90,2,91'] == 'targeted-v2'
          assert next(r for r in exact if r['state'] == '90,69,91')['load'] == '80'
          assert next(r for r in exact if r['state'] == '90,73,91')['load'] == '90'
          assert next(r for r in exact if r['state'] == '90,2,91')['load'] == '90'
          print(f'validated 56 roots: 30 direct witnesses, 26 exact searches, {len(expected_loss_states)} LOSS')
          PY
      - name: Build exact solver
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic
          cpp/solvers/kyouen_solver_10_kyoenc4.cpp
          -o /tmp/kyouen-solver-10-kyoenc4
      - name: Reproduce a fixed independently searched root
        run: |
          printf '%s\n' '2,73,66' > /tmp/three-stone.state
          /tmp/kyouen-solver-10-kyoenc4 /tmp/three-stone.state 3 80 \
            > /tmp/three-stone.out 2> /tmp/three-stone.err
          cat /tmp/three-stone.out
          cat /tmp/three-stone.err
          grep -q '^2-73-66,WIN,10067830,18,10023329,' /tmp/three-stone.out
          grep -q 'forbidden=54441 completed=1 requested=1 memo=10023329 ' /tmp/three-stone.err
