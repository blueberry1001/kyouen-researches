name: Three-stone probe holdout v2 batches preflight

on:
  push:
    branches: [probe-two-stone-subsets]
    paths:
      - '.github/workflows/three-stone-probe-holdout-v2-batches-preflight.yml'
      - 'scripts/freeze_three_stone_probe_holdout_v2_children.py'
      - 'scripts/materialize_three_stone_probe_holdout_v2_batches.py'
      - 'results/10x10/three-stone-probe-holdout-v2.csv'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild frozen children and materialize isolated-runner batches
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-batches-a /tmp/v2-batches-b
          python3 scripts/freeze_three_stone_probe_holdout_v2_children.py \
            results/10x10/three-stone-probe-holdout-v2.csv \
            /tmp/v2-children.csv \
            > /tmp/v2-freeze.log

          expected_children_sha='8cec2f9ae1bee65df13ed87b7f646e8c195ac29a444feb6e59d231e6c94c2a73'
          test "$(sha256sum /tmp/v2-children.csv | cut -d' ' -f1)" = "$expected_children_sha"

          python3 scripts/materialize_three_stone_probe_holdout_v2_batches.py \
            /tmp/v2-children.csv /tmp/v2-batches-a \
            | tee /tmp/v2-batches.log
          python3 scripts/materialize_three_stone_probe_holdout_v2_batches.py \
            /tmp/v2-children.csv /tmp/v2-batches-b \
            > /tmp/v2-batches-second.log

          diff -ru /tmp/v2-batches-a /tmp/v2-batches-b
          test "$(find /tmp/v2-batches-a -maxdepth 1 -name 'children_*_batch*.txt' | wc -l)" -eq 60
          test "$(awk -F, 'NR>1{s+=$3; if($3>20 || $3<1) bad=1} END{if(bad || s!=1161) exit 1}' /tmp/v2-batches-a/v2-batch-manifest.csv; echo $?)" -eq 0
          test "$(awk -F, 'NR>1{p[$1]=1} END{print length(p)}' /tmp/v2-batches-a/v2-batch-manifest.csv)" -eq 12
          if head -n1 /tmp/v2-batches-a/v2-batch-manifest.csv | grep -Eqi 'loss|outcome|memo|visited|maxdepth|seconds'; then
            echo 'result-bearing column leaked into batch preflight' >&2
            exit 1
          fi
          sha256sum /tmp/v2-batches-a/v2-batch-manifest.csv | tee /tmp/v2-batch-manifest.sha256
          echo 'v2_isolated_runner_batch_materialization=PASS'

      - name: Upload outcome-free batch receipt
        uses: actions/upload-artifact@v4
        with:
          name: three-stone-probe-holdout-v2-batches-preflight
          path: |
            /tmp/v2-freeze.log
            /tmp/v2-batches.log
            /tmp/v2-batches-second.log
            /tmp/v2-batch-manifest.sha256
            /tmp/v2-batches-a/v2-batch-manifest.csv
          if-no-files-found: error
          retention-days: 30
