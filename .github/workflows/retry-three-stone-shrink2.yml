name: Retry three-stone roots with shrink 2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/retry-three-stone-shrink2.yml'
      - 'cpp/solvers/**'
  workflow_dispatch:

jobs:
  retry:
    strategy:
      fail-fast: false
      matrix:
        state:
          - '90,61,13'
          - '90,2,69'
          - '90,2,13'
          - '90,2,91'
          - '90,73,91'
          - '90,69,91'
          - '90,66,13'
          - '90,13,91'
          - '2,73,13'
          - '2,69,91'
          - '2,13,91'
          - '69,13,91'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact solver
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic
          cpp/solvers/kyouen_solver_10_kyoenc4.cpp
          -o /tmp/kyouen-solver-10-kyoenc4
      - name: Solve with shrink 2
        shell: bash
        run: |
          state='${{ matrix.state }}'
          safe=${state//,/-}
          printf '%s\n' "$state" > /tmp/one.state
          set +e
          /usr/bin/time -f 'wall=%e rss_kb=%M' -o /tmp/one.time \
            timeout --signal=TERM --kill-after=30s 600s \
            /tmp/kyouen-solver-10-kyoenc4 /tmp/one.state 2 80 \
            > /tmp/one.out 2> /tmp/one.err
          rc=$?
          set -e
          cat /tmp/one.out
          cat /tmp/one.err
          cat /tmp/one.time
          status=ERROR
          case "$rc" in
            0) status=COMPLETE ;;
            3) status=TABLE_FULL ;;
            124) status=TIMEOUT ;;
            137) status=KILLED ;;
          esac
          outcome=''; visited=''; maxdepth=''; memo=''; solver_seconds=''
          if [[ "$rc" = 0 ]]; then
            line=$(tail -n 1 /tmp/one.out)
            outcome=$(awk -F, '{print $2}' <<< "$line")
            visited=$(awk -F, '{print $3}' <<< "$line")
            maxdepth=$(awk -F, '{print $4}' <<< "$line")
            memo=$(awk -F, '{print $5}' <<< "$line")
            solver_seconds=$(awk -F, '{print $6}' <<< "$line")
          else
            memo=$(sed -n 's/.* memo=\([0-9][0-9]*\).*/\1/p' /tmp/one.err | tail -n 1)
            solver_seconds=$(sed -n 's/.* seconds=\([0-9.eE+-][0-9.eE+-]*\).*/\1/p' /tmp/one.err | tail -n 1)
          fi
          wall=$(sed -n 's/wall=\([^ ]*\).*/\1/p' /tmp/one.time)
          rss=$(sed -n 's/.*rss_kb=\([0-9][0-9]*\).*/\1/p' /tmp/one.time)
          printf '%s\n' 'state,status,outcome,visited,maxdepth,memo,solver_seconds,exit_code,wall_seconds,max_rss_kb,shrink' > "retry-$safe.csv"
          printf '"%s",%s,%s,%s,%s,%s,%s,%s,%s,%s,2\n' \
            "$state" "$status" "$outcome" "$visited" "$maxdepth" "$memo" \
            "$solver_seconds" "$rc" "$wall" "$rss" >> "retry-$safe.csv"
          cat "retry-$safe.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: retry-${{ strategy.job-index }}
          path: retry-*.csv
