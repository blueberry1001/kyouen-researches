name: nohit-fastpath-smoke

on:
  push:
    branches:
      - preregister-10x10-cache-aware-nohit-fastpath
    paths:
      - '.github/workflows/nohit-fastpath-smoke.yml'
      - 'scripts/probe_cert_solver.cpp'
      - 'scripts/probe_parts/**'
      - 'scripts/prepare_cache_aware_nohit_fastpath.py'
      - 'scripts/audit_cache_aware_nohit_fastpath_source_diff.py'
      - 'scripts/build_nohit_fastpath_binary.py'
      - 'scripts/test_cache_aware_nohit_fastpath_equivalence.py'
      - 'scripts/test_nohit_fastpath_solver_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Frozen order-rule equivalence
        run: python3 scripts/test_cache_aware_nohit_fastpath_equivalence.py

      - name: Frozen solver source audit
        run: python3 scripts/audit_cache_aware_nohit_fastpath_source_diff.py

      - name: Build sealed no-hit binary
        run: python3 scripts/build_nohit_fastpath_binary.py

      - name: Full-capacity empty-state allocation smoke
        run: |
          free -h
          nproc
          : > /tmp/nohit-empty-states.txt
          /usr/bin/time -v ./tmp-kb/nohit_fastpath_ab_native /tmp/nohit-empty-states.txt 0 90 0 0 --cache-aware-order-impl sort

      - name: Capped solver integration smoke
        run: python3 scripts/test_nohit_fastpath_solver_smoke.py
