name: Cleanup merged research branches once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          test "$default_branch" = "main"

          mapfile -t refs < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref'
          )

          failures=0
          deleted=0
          for ref in "${refs[@]}"; do
            if [[ "$ref" == "refs/heads/main" ]]; then
              continue
            fi
            short="${ref#refs/}"
            echo "Deleting $ref"
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$short"; then
              deleted=$((deleted + 1))
            else
              failures=$((failures + 1))
            fi
          done

          mapfile -t remaining < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref'
          )
          printf 'Deleted: %d\n' "$deleted"
          printf 'Remaining refs:\n%s\n' "${remaining[*]}"
          test "$failures" = "0"
          test "${#remaining[@]}" = "1"
          test "${remaining[0]}" = "refs/heads/main"
