name: Five-stone 10x10 proof regression

on:
  push:
    branches: [main]
    paths:
      - 'cpp/solvers/**'
      - 'rust/independent-verifier/**'
      - '.github/workflows/five-stone-proof-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cpp/solvers/**'
      - 'rust/independent-verifier/**'
      - '.github/workflows/five-stone-proof-regression.yml'
  workflow_dispatch:

jobs:
  five-stone-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact solver and independent verifier
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            cpp/solvers/kyouen_solver_10_kyoenc4.cpp \
            -o /tmp/kyouen-solver-10-kyoenc4
          cargo build --release --manifest-path rust/independent-verifier/Cargo.toml \
            --bin kyouen-cert-verify
      - name: Generate the fixed five-stone LOSS proof
        run: |
          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '61,2,73,13,91' \
            /tmp/five-stone-loss.cert \
            3 80 2000000 /tmp/five-stone-proof.index 0 0 \
            /tmp/five-stone-witness.log 0 \
            /tmp/five-stone-witness.index 6000000 \
            > /tmp/five-stone.out 2> /tmp/five-stone.err
          cat /tmp/five-stone.out
          cat /tmp/five-stone.err
          grep -q '^61,2,73,13,91,LOSS,7404873,19,7396568,' /tmp/five-stone.out
          grep -q 'certificate nodes=1533310 recomputed=1006501 bytes=36799488 root_stones=5 proof_index=mmap index_bytes=100663360 ' /tmp/five-stone.err
          grep -q 'witness_log loaded=0 appended=4970738 unique=4970738 conflicts=252 proof_hits=1006501 proof_misses=0 bytes=119297744 witness_index=mmap index_bytes=402653248 indexed_records=4970738 rebuilt_records=0' /tmp/five-stone.err
          test "$(stat -c %s /tmp/five-stone-loss.cert)" = 36799488
          test "$(stat -c %s /tmp/five-stone-proof.index)" = 100663360
          test "$(stat -c %s /tmp/five-stone-witness.log)" = 119297744
          test "$(stat -c %s /tmp/five-stone-witness.index)" = 402653248
      - name: Independently verify all 1533310 proof nodes
        run: |
          rust/independent-verifier/target/release/kyouen-cert-verify \
            /tmp/five-stone-loss.cert | tee /tmp/five-stone.verify
          grep -q '^nodes=1533310$' /tmp/five-stone.verify
          grep -q '^losing_nodes=526809$' /tmp/five-stone.verify
          grep -q '^winning_nodes=1006501$' /tmp/five-stone.verify
          grep -q '^root_stones=5$' /tmp/five-stone.verify
          grep -q '^root_outcome=LOSS$' /tmp/five-stone.verify
