name: Rust independent verifier

on:
  push:
    branches: [main]
    paths:
      - 'rust/independent-verifier/**'
      - 'cpp/tools/kyouen_query.cpp'
      - 'cpp/certificate/**'
      - 'cpp/solvers/kyouen_solver_10_kyoenc4.cpp'
      - 'cpp/solvers/parts/**'
      - 'KYOENC4.md'
      - '.github/workflows/rust-verifier.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/independent-verifier/**'
      - 'cpp/tools/kyouen_query.cpp'
      - 'cpp/certificate/**'
      - 'cpp/solvers/kyouen_solver_10_kyoenc4.cpp'
      - 'cpp/solvers/parts/**'
      - 'KYOENC4.md'
      - '.github/workflows/rust-verifier.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build, cross-check, and verify certificate DAGs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/independent-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --release
      - name: Reference self-test
        run: cargo run --release -- self-test
      - name: Audit bundled 10x10 evidence summary
        run: cargo run --release -- audit-evidence evidence-sample
      - name: Build C++ query tool
        run: g++ -std=c++20 -O2 -Wall -Wextra -pedantic ../../cpp/tools/kyouen_query.cpp -o /tmp/kyouen-query
      - name: Cross-check complete outcomes on 4x4 samples
        run: >-
          cargo run --release --bin kyouen-cross-check --
          --cpp /tmp/kyouen-query
          --size 4
          --samples 40
          --seed 20260801
          --max-stones 8
          --solve-max-size 4
      - name: Cross-check 10x10 geometry and legal moves
        run: >-
          cargo run --release --bin kyouen-cross-check --
          --cpp /tmp/kyouen-query
          --size 10
          --samples 100
          --seed 20260802
          --max-stones 12
          --solve-max-size 0
      - name: Build C++ KYOENC3 generator and checker
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic ../../cpp/certificate/kyouen_certgen_1_to_8.cpp -o /tmp/kyouen-certgen
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic ../../cpp/certificate/kyouen_certcheck.cpp -o /tmp/kyouen-certcheck
      - name: Generate and independently verify 1x1 through 6x6 KYOENC3 DAGs
        run: |
          for n in 1 2 3 4 5 6; do
            cert="/tmp/kyouen-${n}.cert"
            /tmp/kyouen-certgen "$n" "$cert"
            /tmp/kyouen-certcheck "$cert"
            cargo run --release --bin kyouen-cert-verify -- "$cert"
          done
      - name: Build 10x10 KYOENC4 smoke generator
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic
          ../../cpp/certificate/kyouen_certgen_v4_smoke.cpp
          -o /tmp/kyouen-certgen-v4-smoke
      - name: Generate and verify a high-word 10x10 KYOENC4 DAG
        run: |
          /tmp/kyouen-certgen-v4-smoke /tmp/kyouen-10-smoke.cert
          cargo run --release --bin kyouen-cert-verify -- /tmp/kyouen-10-smoke.cert | tee /tmp/kyoenc4-report.txt
          grep -q '^format=KYOENC4$' /tmp/kyoenc4-report.txt
          grep -q '^board=10x10$' /tmp/kyoenc4-report.txt
          grep -q '^nodes=2$' /tmp/kyoenc4-report.txt
          grep -q '^forbidden_quadruples=54441$' /tmp/kyoenc4-report.txt
          grep -q '^root_outcome=WIN$' /tmp/kyoenc4-report.txt
      - name: Build the exact 10x10 solver with KYOENC4 export
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic
          ../../cpp/solvers/kyouen_solver_10_kyoenc4.cpp
          -o /tmp/kyouen-solver-10-kyoenc4
      - name: Export and independently verify a DAG from the exact solver
        run: |
          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '7,16,17,28,30,33,41,48,54,68,69,71,81,92' \
            /tmp/solver-export.cert \
            3 80 1000 > /tmp/solver-export.txt 2> /tmp/solver-export.err
          cat /tmp/solver-export.txt
          cat /tmp/solver-export.err
          grep -q ',WIN,' /tmp/solver-export.txt
          grep -q 'proof_index=memory' /tmp/solver-export.err
          cargo run --release --bin kyouen-cert-verify -- /tmp/solver-export.cert | tee /tmp/solver-export-report.txt
          grep -q '^format=KYOENC4$' /tmp/solver-export-report.txt
          grep -q '^board=10x10$' /tmp/solver-export-report.txt
          grep -q '^nodes=2$' /tmp/solver-export-report.txt
          grep -q '^root_stones=14$' /tmp/solver-export-report.txt
          grep -q '^root_outcome=WIN$' /tmp/solver-export-report.txt
      - name: Export and verify the same DAG with an mmap proof index
        run: |
          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '7,16,17,28,30,33,41,48,54,68,69,71,81,92' \
            /tmp/solver-export-disk.cert \
            3 80 1000 /tmp/solver-proof.index \
            > /tmp/solver-export-disk.txt 2> /tmp/solver-export-disk.err
          cat /tmp/solver-export-disk.txt
          cat /tmp/solver-export-disk.err
          grep -q ',WIN,' /tmp/solver-export-disk.txt
          grep -q 'proof_index=mmap' /tmp/solver-export-disk.err
          test -s /tmp/solver-proof.index
          cargo run --release --bin kyouen-cert-verify -- /tmp/solver-export-disk.cert | tee /tmp/solver-export-disk-report.txt
          grep -q '^format=KYOENC4$' /tmp/solver-export-disk-report.txt
          grep -q '^board=10x10$' /tmp/solver-export-disk-report.txt
          grep -q '^nodes=2$' /tmp/solver-export-disk-report.txt
          grep -q '^root_stones=14$' /tmp/solver-export-disk-report.txt
          grep -q '^root_outcome=WIN$' /tmp/solver-export-disk-report.txt
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              data = Path(path).read_bytes()
              header = data[:48]
              nodes = {data[i:i+24] for i in range(48, len(data), 24)}
              return header, nodes
          memory = read('/tmp/solver-export.cert')
          disk = read('/tmp/solver-export-disk.cert')
          assert memory == disk, 'memory and mmap certificates differ semantically'
          PY
      - name: Export and verify a 6524-node 10x10 LOSS proof
        run: |
          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '90,61,2,73,69,66,13,91' \
            /tmp/solver-medium.cert \
            3 80 10000 /tmp/solver-medium.index \
            > /tmp/solver-medium.txt 2> /tmp/solver-medium.err
          cat /tmp/solver-medium.txt
          cat /tmp/solver-medium.err
          grep -q ',LOSS,' /tmp/solver-medium.txt
          grep -q 'certificate nodes=6524 ' /tmp/solver-medium.err
          grep -q 'recomputed=8778 ' /tmp/solver-medium.err
          grep -q 'proof_index=mmap' /tmp/solver-medium.err
          test "$(stat -c %s /tmp/solver-medium.cert)" = 156624
          test "$(stat -c %s /tmp/solver-medium.index)" = 393280
          cargo run --release --bin kyouen-cert-verify -- /tmp/solver-medium.cert | tee /tmp/solver-medium-report.txt
          grep -q '^format=KYOENC4$' /tmp/solver-medium-report.txt
          grep -q '^board=10x10$' /tmp/solver-medium-report.txt
          grep -q '^nodes=6524$' /tmp/solver-medium-report.txt
          grep -q '^root_stones=8$' /tmp/solver-medium-report.txt
          grep -q '^root_outcome=LOSS$' /tmp/solver-medium-report.txt
      - name: Checkpoint and resume the 6524-node proof
        run: |
          rm -f /tmp/solver-resume.cert /tmp/solver-resume.index
          set +e
          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '90,61,2,73,69,66,13,91' \
            /tmp/solver-resume.cert \
            3 80 10000 /tmp/solver-resume.index 0 100 \
            > /tmp/solver-resume-first.txt 2> /tmp/solver-resume-first.err
          first_rc=$?
          set -e
          cat /tmp/solver-resume-first.txt
          cat /tmp/solver-resume-first.err
          test "$first_rc" = 4
          grep -q ',LOSS,' /tmp/solver-resume-first.txt
          grep -q '^proof_checkpoint=1$' /tmp/solver-resume-first.err
          test -s /tmp/solver-resume.index
          test ! -e /tmp/solver-resume.cert

          /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '90,61,2,73,69,66,13,91' \
            /tmp/solver-resume.cert \
            3 80 10000 /tmp/solver-resume.index 1 0 \
            > /tmp/solver-resume-second.txt 2> /tmp/solver-resume-second.err
          cat /tmp/solver-resume-second.txt
          cat /tmp/solver-resume-second.err
          grep -q ',LOSS,' /tmp/solver-resume-second.txt
          grep -q 'certificate nodes=6524 ' /tmp/solver-resume-second.err
          grep -q 'recomputed=8662 ' /tmp/solver-resume-second.err
          grep -q 'resumed_nodes=102 ' /tmp/solver-resume-second.err
          grep -q 'discarded_pending=3' /tmp/solver-resume-second.err
          test "$(stat -c %s /tmp/solver-resume.cert)" = 156624
          test "$(stat -c %s /tmp/solver-resume.index)" = 393280
          cargo run --release --bin kyouen-cert-verify -- /tmp/solver-resume.cert | tee /tmp/solver-resume-report.txt
          grep -q '^format=KYOENC4$' /tmp/solver-resume-report.txt
          grep -q '^board=10x10$' /tmp/solver-resume-report.txt
          grep -q '^nodes=6524$' /tmp/solver-resume-report.txt
          grep -q '^root_stones=8$' /tmp/solver-resume-report.txt
          grep -q '^root_outcome=LOSS$' /tmp/solver-resume-report.txt
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              data = Path(path).read_bytes()
              return data[:48], {data[i:i+24] for i in range(48, len(data), 24)}
          clean = read('/tmp/solver-medium.cert')
          resumed = read('/tmp/solver-resume.cert')
          assert clean == resumed, 'resumed proof differs from clean extraction'
          PY
