name: Knowledge structure

on:
  push:
    paths:
      - 'research/knowledge/**'
      - 'research/experiments/**'
      - 'research/log/**'
      - 'research/archive/**'
      - 'tools/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  pull_request:
    paths:
      - 'research/knowledge/**'
      - 'research/experiments/**'
      - 'research/log/**'
      - 'research/archive/**'
      - 'tools/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install knowledge tooling dependencies
        run: python -m pip install -r tools/knowledge/requirements.txt

      - name: Validate knowledge items
        run: python tools/knowledge/check.py

      - name: Build generated views
        run: python tools/knowledge/build.py
