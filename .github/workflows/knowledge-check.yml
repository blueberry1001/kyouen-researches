name: Knowledge structure

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'research/knowledge/**'
      - 'research/experiments/**'
      - 'research/log/**'
      - 'research/archive/**'
      - 'tools/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'research/knowledge/**'
      - 'research/experiments/**'
      - 'research/log/**'
      - 'research/archive/**'
      - 'tools/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Validate knowledge items
        run: uv run --locked python tools/knowledge/check.py

      - name: Rebuild generated views
        run: uv run --locked python tools/knowledge/build.py

      - name: Verify generated views are committed
        shell: bash
        run: |
          changes="$(git status --porcelain -- research/knowledge/generated)"
          if [ -n "$changes" ]; then
            echo "Generated knowledge views are out of date:"
            printf '%s\n' "$changes"
            echo
            git diff -- research/knowledge/generated || true
            echo
            echo "Run: uv run --locked python tools/knowledge/build.py"
            exit 1
          fi
