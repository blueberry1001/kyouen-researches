name: Export six-stone LOSS proof

on:
  push:
    branches: [probe-seven-stone-roots]
    paths:
      - '.github/workflows/export-six-stone-loss-proof.yml'
      - 'cpp/solvers/**'
      - 'rust/independent-verifier/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-six-stone-loss-proof.yml'
      - 'cpp/solvers/**'
      - 'rust/independent-verifier/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact solver and independent verifier
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            cpp/solvers/kyouen_solver_10_kyoenc4.cpp \
            -o /tmp/kyouen-solver-10-kyoenc4
          cargo build --release --manifest-path rust/independent-verifier/Cargo.toml \
            --bin kyouen-cert-verify
      - name: Search and export with disk-backed indexes
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'wall=%e rss_kb=%M' -o /tmp/six-loss.time \
            timeout --signal=TERM --kill-after=15s 600s \
            /tmp/kyouen-solver-10-kyoenc4 \
            --certificate \
            '90,61,2,73,69,66' \
            /tmp/six-loss.cert \
            3 80 5000000 /tmp/six-loss-proof.index 0 0 \
            /tmp/six-loss-witness.log 0 \
            /tmp/six-loss-witness.index 10000000 \
            > /tmp/six-loss.out 2> /tmp/six-loss.err
          rc=$?
          set -e
          echo "$rc" > /tmp/six-loss.exit
          cat /tmp/six-loss.out
          cat /tmp/six-loss.err
          cat /tmp/six-loss.time
      - name: Independently verify a completed certificate
        shell: bash
        run: |
          rc=$(cat /tmp/six-loss.exit)
          if [[ "$rc" = 0 ]]; then
            /usr/bin/time -f 'verify_wall=%e verify_rss_kb=%M' -o /tmp/six-loss-verify.time \
              timeout --signal=TERM --kill-after=15s 600s \
              rust/independent-verifier/target/release/kyouen-cert-verify \
              /tmp/six-loss.cert \
              > /tmp/six-loss-verify.out 2> /tmp/six-loss-verify.err
            cat /tmp/six-loss-verify.out
            cat /tmp/six-loss-verify.err
            cat /tmp/six-loss-verify.time
            grep -q '^root_outcome=LOSS$' /tmp/six-loss-verify.out
          else
            : > /tmp/six-loss-verify.out
            : > /tmp/six-loss-verify.err
            : > /tmp/six-loss-verify.time
          fi
      - name: Assemble benchmark summary
        run: |
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path

          def read(path):
              p = Path(path)
              return p.read_text() if p.exists() else ''
          stdout = read('/tmp/six-loss.out')
          stderr = read('/tmp/six-loss.err')
          timing = read('/tmp/six-loss.time')
          verified = read('/tmp/six-loss-verify.out')
          verify_timing = read('/tmp/six-loss-verify.time')
          exit_code = int(read('/tmp/six-loss.exit').strip())
          def find(pattern, text, default=''):
              match = re.search(pattern, text)
              return match.group(1) if match else default
          result_line = stdout.splitlines()[-1] if len(stdout.splitlines()) >= 2 else ''
          fields = result_line.split(',')
          row = {
              'state': '90,61,2,73,69,66',
              'exit_code': exit_code,
              'status': {0:'COMPLETE',3:'TABLE_FULL',4:'CHECKPOINT',124:'TIMEOUT',137:'KILLED'}.get(exit_code,'ERROR'),
              'outcome': fields[1] if len(fields) >= 6 else '',
              'search_visited': fields[2] if len(fields) >= 6 else '',
              'search_maxdepth': fields[3] if len(fields) >= 6 else '',
              'search_memo': fields[4] if len(fields) >= 6 else '',
              'search_seconds': fields[5] if len(fields) >= 6 else '',
              'proof_nodes': find(r'certificate nodes=(\d+)', stderr),
              'proof_recomputed': find(r'recomputed=(\d+)', stderr),
              'certificate_bytes': str(Path('/tmp/six-loss.cert').stat().st_size) if Path('/tmp/six-loss.cert').exists() else '',
              'proof_index_bytes': str(Path('/tmp/six-loss-proof.index').stat().st_size) if Path('/tmp/six-loss-proof.index').exists() else '',
              'witness_unique': find(r'witness_log .* unique=(\d+)', stderr),
              'witness_hits': find(r'proof_hits=(\d+)', stderr),
              'witness_misses': find(r'proof_misses=(\d+)', stderr),
              'witness_log_bytes': str(Path('/tmp/six-loss-witness.log').stat().st_size) if Path('/tmp/six-loss-witness.log').exists() else '',
              'witness_index_bytes': str(Path('/tmp/six-loss-witness.index').stat().st_size) if Path('/tmp/six-loss-witness.index').exists() else '',
              'wall_seconds': find(r'wall=([^ ]+)', timing),
              'max_rss_kb': find(r'rss_kb=(\d+)', timing),
              'verified': 'yes' if 'CERTIFICATE VALID' in verified else 'no',
              'verify_wall_seconds': find(r'verify_wall=([^ ]+)', verify_timing),
              'verify_max_rss_kb': find(r'verify_rss_kb=(\d+)', verify_timing),
          }
          with open('six-stone-loss-proof-summary.csv','w',newline='') as output:
              writer=csv.DictWriter(output,fieldnames=row.keys())
              writer.writeheader();writer.writerow(row)
          PY
          cat six-stone-loss-proof-summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: six-stone-loss-proof-summary
          path: six-stone-loss-proof-summary.csv
      - name: Compress completed certificate
        if: always()
        run: |
          if test -s /tmp/six-loss.cert; then
            zstd -T0 -19 /tmp/six-loss.cert -o six-stone-loss.cert.zst
          else
            : > six-stone-loss.cert.zst
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: six-stone-loss-certificate
          path: six-stone-loss.cert.zst
