name: TEMP F-E corrected-memo revalidation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  revalidate:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected frozen solver
        run: |
          c++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG \
            cpp/solvers/kyouen_solver_10_f_e_plain.cpp \
            -o /tmp/fe-solver
          /tmp/fe-solver --memo-self-test
      - name: Revalidate frozen labels
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            0) cat > /tmp/cases <<'EOF'
2,4,27,88|WIN
0,2,58,60|WIN
0,1,12,65|WIN
1,6,69,79|WIN
1,50,52,68|WIN
1,2,8,55|WIN
EOF
               ;;
            1) cat > /tmp/cases <<'EOF'
1,58,64,88|WIN
0,3,85,88|WIN
0,18,57,92|WIN
0,2,8,44|WIN
2,7,12,39|WIN
0,1,84,89|WIN
EOF
               ;;
            2) cat > /tmp/cases <<'EOF'
1,36,48,77|WIN
3,31,77,78|WIN
1,13,45,64|LOSS
1,38,42,43|WIN
2,49,56,62|WIN
1,32,65,76|LOSS
EOF
               ;;
            3) cat > /tmp/cases <<'EOF'
2,28,39,43|WIN
2,4,45,54|LOSS
0,16,46,75|WIN
1,26,32,71|LOSS
2,26,31,42|WIN
2,3,4,56|WIN
EOF
               ;;
            4) cat > /tmp/cases <<'EOF'
12,25,38,74|WIN
12,15,52,74|WIN
22,26,44,73|LOSS
3,34,62,84|LOSS
4,54,61,66|LOSS
3,41,47,85|WIN
EOF
               ;;
            5) cat > /tmp/cases <<'EOF'
4,31,56,83|WIN
13,41,43,75|WIN
3,23,33,46|WIN
4,44,45,46|LOSS
3,36,53,95|LOSS
3,44,66,77|LOSS
EOF
               ;;
          esac

          : > /tmp/results.csv
          echo 'state,expected,actual,visited,memo_used,seconds' >> /tmp/results.csv
          while IFS='|' read -r state expected; do
            printf '%s\n' "$state" > /tmp/state.txt
            out=$(/tmp/fe-solver /tmp/state.txt 28)
            row=$(printf '%s\n' "$out" | tail -n 1)
            actual=$(printf '%s\n' "$row" | awk -F, '{print $(NF-3)}')
            visited=$(printf '%s\n' "$row" | awk -F, '{print $(NF-2)}')
            memo=$(printf '%s\n' "$row" | awk -F, '{print $(NF-1)}')
            seconds=$(printf '%s\n' "$row" | awk -F, '{print $NF}')
            echo "$state,$expected,$actual,$visited,$memo,$seconds" >> /tmp/results.csv
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::label changed for $state: expected=$expected actual=$actual"
              exit 1
            fi
          done < /tmp/cases
          cat /tmp/results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: fe-corrected-shard-${{ matrix.shard }}
          path: /tmp/results.csv
