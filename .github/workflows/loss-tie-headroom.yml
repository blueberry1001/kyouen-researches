name: Loss tie-break headroom

on:
  push:
    branches: [analyze-10x10-parent-loss-cost]
    paths:
      - 'scripts/analyze_loss_tie_headroom.py'
      - 'results/10x10/parent-benchmark/loss_proof_cost_dataset.csv'
      - '.github/workflows/loss-tie-headroom.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quantify legal-count tie-break headroom
        run: |
          python3 scripts/analyze_loss_tie_headroom.py | tee /tmp/loss-tie-headroom.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loss-tie-headroom
          path: /tmp/loss-tie-headroom.txt
