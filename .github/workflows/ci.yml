name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpp:
    name: C++ build and small-certificate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Compile and self-test 10x10/11x11 root research solvers
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic cpp/solvers/kyouen_solver_10_root.cpp -o /tmp/kyouen_solver_10_root
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic cpp/solvers/kyouen_solver_11_root.cpp -o /tmp/kyouen_solver_11_root
          /tmp/kyouen_solver_10_root --memo-self-test
          /tmp/kyouen_solver_11_root --memo-self-test
          printf 'canonical_parent,move\n"14,64",74\n' > /tmp/root10-regression.csv
          /tmp/kyouen_solver_10_root /tmp/root10-regression.csv 25 | tee /tmp/root10-regression.out
          grep -q '^"14,64",74,WIN,' /tmp/root10-regression.out
      - name: Generate and check 1x1 through 6x6
        run: |
          mkdir -p /tmp/kyouen-certs
          for n in 1 2 3 4 5 6; do
            ./build/kyouen-certgen-1-to-8 "$n" "/tmp/kyouen-certs/${n}.cert"
            ./build/kyouen-certcheck "/tmp/kyouen-certs/${n}.cert"
          done

  lean:
    name: Lean soundness layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true


  fe-memo-revalidate:
    name: F-E corrected memo shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected frozen F-E solver
        run: |
          c++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG \
            cpp/solvers/kyouen_solver_10_f_e_plain.cpp \
            -o /tmp/fe-solver
          /tmp/fe-solver --memo-self-test
      - name: Revalidate frozen labels
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            0) cat > /tmp/cases <<'EOF'
2,4,27,88|WIN
0,2,58,60|WIN
0,1,12,65|WIN
1,6,69,79|WIN
1,50,52,68|WIN
1,2,8,55|WIN
EOF
               ;;
            1) cat > /tmp/cases <<'EOF'
1,58,64,88|WIN
0,3,85,88|WIN
0,18,57,92|WIN
0,2,8,44|WIN
2,7,12,39|WIN
0,1,84,89|WIN
EOF
               ;;
            2) cat > /tmp/cases <<'EOF'
1,36,48,77|WIN
3,31,77,78|WIN
1,13,45,64|LOSS
1,38,42,43|WIN
2,49,56,62|WIN
1,32,65,76|LOSS
EOF
               ;;
            3) cat > /tmp/cases <<'EOF'
2,28,39,43|WIN
2,4,45,54|LOSS
0,16,46,75|WIN
1,26,32,71|LOSS
2,26,31,42|WIN
2,3,4,56|WIN
EOF
               ;;
            4) cat > /tmp/cases <<'EOF'
12,25,38,74|WIN
12,15,52,74|WIN
22,26,44,73|LOSS
3,34,62,84|LOSS
4,54,61,66|LOSS
3,41,47,85|WIN
EOF
               ;;
            5) cat > /tmp/cases <<'EOF'
4,31,56,83|WIN
13,41,43,75|WIN
3,23,33,46|WIN
4,44,45,46|LOSS
3,36,53,95|LOSS
3,44,66,77|LOSS
EOF
               ;;
          esac

          echo 'state,expected,actual,visited,memo_used,seconds'
          while IFS='|' read -r state expected; do
            printf '%s\n' "$state" > /tmp/state.txt
            out=$(/tmp/fe-solver /tmp/state.txt 28)
            row=$(printf '%s\n' "$out" | tail -n 1)
            actual=$(printf '%s\n' "$row" | awk -F, '{print $(NF-3)}')
            visited=$(printf '%s\n' "$row" | awk -F, '{print $(NF-2)}')
            memo=$(printf '%s\n' "$row" | awk -F, '{print $(NF-1)}')
            seconds=$(printf '%s\n' "$row" | awk -F, '{print $NF}')
            echo "$state,$expected,$actual,$visited,$memo,$seconds"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::label changed for $state: expected=$expected actual=$actual"
              exit 1
            fi
          done < /tmp/cases
